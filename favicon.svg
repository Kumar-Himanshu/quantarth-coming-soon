<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#06090f" stroke="url(#fav-ring)" stroke-width="1"/>
  <!-- Central node -->
  <circle cx="16" cy="16" r="4" fill="url(#fav-center)"/>
  <!-- Outer nodes -->
  <circle cx="16" cy="5"  r="2" fill="url(#fav-node)" opacity="0.85"/>
  <circle cx="25" cy="11" r="2" fill="url(#fav-node)" opacity="0.75"/>
  <circle cx="25" cy="21" r="2" fill="url(#fav-node)" opacity="0.85"/>
  <circle cx="16" cy="27" r="2" fill="url(#fav-node)" opacity="0.7"/>
  <circle cx="7"  cy="21" r="2" fill="url(#fav-node)" opacity="0.8"/>
  <circle cx="7"  cy="11" r="2" fill="url(#fav-node)" opacity="0.9"/>
  <!-- Spoke lines -->
  <line x1="16" y1="12" x2="16" y2="7"   stroke="url(#fav-spoke)" stroke-width="0.8"/>
  <line x1="19" y1="14" x2="23" y2="12"  stroke="url(#fav-spoke)" stroke-width="0.8"/>
  <line x1="19" y1="18" x2="23" y2="20"  stroke="url(#fav-spoke)" stroke-width="0.8"/>
  <line x1="16" y1="20" x2="16" y2="25"  stroke="url(#fav-spoke)" stroke-width="0.8"/>
  <line x1="13" y1="18" x2="9"  y2="20"  stroke="url(#fav-spoke)" stroke-width="0.8"/>
  <line x1="13" y1="14" x2="9"  y2="12"  stroke="url(#fav-spoke)" stroke-width="0.8"/>
  <!-- Q tail -->
  <line x1="18" y1="18" x2="21" y2="22" stroke="url(#fav-tail)" stroke-width="1.8" stroke-linecap="round"/>
  <defs>
    <linearGradient id="fav-ring" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="fav-center">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </radialGradient>
    <radialGradient id="fav-node">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="fav-spoke">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="fav-tail">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
</svg>
